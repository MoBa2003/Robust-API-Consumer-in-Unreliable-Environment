apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-client
  labels:
    app.kubernetes.io/name: cluster-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: cluster-client:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: cluster-client-config
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}